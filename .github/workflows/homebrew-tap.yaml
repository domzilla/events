name: Homebrew Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-bottles:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-15
            bottle_tag: arm64_sonoma
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            bottle_tag: sonoma

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build release binary
        run: |
          cd src
          xcodebuild -scheme events -configuration Release -derivedDataPath ../build -destination "platform=macOS" build

      - name: Verify binary
        run: ./build/Build/Products/Release/events --version

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create bottle structure
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BOTTLE_DIR="events/$VERSION"

          # Create Homebrew-style directory structure
          mkdir -p "$BOTTLE_DIR/bin"
          cp build/Build/Products/Release/events "$BOTTLE_DIR/bin/"

      - name: Create bottle tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BOTTLE_TAG=${{ matrix.bottle_tag }}

          tar -czf "events-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" events

          # Calculate SHA256
          shasum -a 256 "events-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" > "events-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz.sha256"

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.bottle_tag }}
          path: |
            events-*.bottle.tar.gz
            events-*.bottle.tar.gz.sha256

  release:
    name: Create Release
    needs: build-bottles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottles
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bottles/*
          generate_release_notes: true
          draft: false

      - name: Prepare bottle info
        id: bottles
        run: |
          cd bottles
          echo "arm64_sha=$(cat events-${{ steps.version.outputs.version }}.arm64_sonoma.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$(cat events-${{ steps.version.outputs.version }}.sonoma.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Output bottle info
        run: |
          echo "## Bottle SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add this to your formula:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```ruby' >> $GITHUB_STEP_SUMMARY
          echo "bottle do" >> $GITHUB_STEP_SUMMARY
          echo '  root_url "https://github.com/domzilla/events/releases/download/${{ github.ref_name }}"' >> $GITHUB_STEP_SUMMARY
          echo '  sha256 cellar: :any_skip_relocation, arm64_sonoma: "${{ steps.bottles.outputs.arm64_sha }}"' >> $GITHUB_STEP_SUMMARY
          echo '  sha256 cellar: :any_skip_relocation, sonoma: "${{ steps.bottles.outputs.x86_64_sha }}"' >> $GITHUB_STEP_SUMMARY
          echo "end" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  update-formula:
    name: Update Homebrew Formula
    needs: [build-bottles, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottles
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Calculate source SHA256
        id: source
        run: |
          curl -sL "https://github.com/domzilla/events/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          echo "sha256=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Get bottle SHA256s
        id: bottles
        run: |
          cd bottles
          echo "arm64_sha=$(cat events-${{ steps.version.outputs.version }}.arm64_sonoma.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$(cat events-${{ steps.version.outputs.version }}.sonoma.bottle.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: domzilla/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ github.ref_name }}
          SOURCE_SHA=${{ steps.source.outputs.sha256 }}
          ARM64_SHA=${{ steps.bottles.outputs.arm64_sha }}
          X86_64_SHA=${{ steps.bottles.outputs.x86_64_sha }}

          cat > homebrew-tap/Formula/events.rb << 'FORMULA'
          class Events < Formula
            desc "CLI tool for interacting with macOS Calendar and Reminders via EventKit"
            homepage "https://github.com/domzilla/events"
            url "https://github.com/domzilla/events/archive/refs/tags/TAG_PLACEHOLDER.tar.gz"
            sha256 "SOURCE_SHA_PLACEHOLDER"
            license "MIT"
            head "https://github.com/domzilla/events.git", branch: "main"

            bottle do
              root_url "https://github.com/domzilla/events/releases/download/TAG_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, arm64_sonoma: "ARM64_SHA_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, sonoma: "X86_64_SHA_PLACEHOLDER"
            end

            depends_on xcode: ["14.0", :build]
            depends_on :macos

            def install
              cd "src" do
                system "xcodebuild", "-scheme", "events",
                       "-configuration", "Release",
                       "-derivedDataPath", buildpath/"build",
                       "-destination", "platform=macOS",
                       "build"
              end
              bin.install buildpath/"build/Build/Products/Release/events"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/events --version")
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" homebrew-tap/Formula/events.rb
          sed -i "s|SOURCE_SHA_PLACEHOLDER|${SOURCE_SHA}|g" homebrew-tap/Formula/events.rb
          sed -i "s|ARM64_SHA_PLACEHOLDER|${ARM64_SHA}|g" homebrew-tap/Formula/events.rb
          sed -i "s|X86_64_SHA_PLACEHOLDER|${X86_64_SHA}|g" homebrew-tap/Formula/events.rb

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/events.rb
          git commit -m "Update events to ${{ steps.version.outputs.version }}"
          git push
